name: 2stagram
services:
  backend:
    build:
      context: .
      target: backend
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /app/db/2stagram.db
      MEDIA_PATH: /app/media
      MAX_UPLOAD_SIZE_MB: 25
      SESSION_SECRET: ${SESSION_SECRET:?Exécuter npm run setup pour créer .env}
    volumes:
      - db:/app/db
      - media:/app/media
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status===404?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    init: true
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  frontend:
    build:
      context: .
      target: frontend
    ports: ['127.0.0.1:${WEB_PORT:-8080}:8080']
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 10s
      timeout: 3s
      retries: 3
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
volumes:
  db:
  media:
