name: Documentation
on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'
  pull_request:
    paths:
      - 'docs-site/package.json'
      - 'docs-site/package-lock.json'
      - '.github/workflows/docs.yml'
      - 'scripts/*audit*.ts'
      - 'package.json'
      - 'docs/dependances.md'
  push:
    branches: [main]
    paths:
      - 'docs-site/package.json'
      - 'docs-site/package-lock.json'
      - '.github/workflows/docs.yml'
      - 'scripts/*audit*.ts'
      - 'package.json'
      - 'docs/dependances.md'
permissions:
  contents: read
jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs-site/package-lock.json
      - run: npm ci
      - run: npm ci --prefix docs-site
      - run: npm run docs:site
        timeout-minutes: 10
      - uses: actions/upload-artifact@v4
        with: { name: documentation, path: docs-site/build/ }
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci --prefix docs-site
      - run: npm run audit:docs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-audit
          path: docs-site/audit-report.json
          retention-days: 30
